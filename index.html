<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GameCraft AI Mini App</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand">🎮 GameCraft AI</div>
      <span id="familyBadge" class="badge">Game</span>
      <h1 id="gameTitle">Учебная игра</h1>
      <p id="subtitle">Игра создана из материала пользователя.</p>
    </header>

    <section class="hud">
      <div><small>Уровень</small><strong id="level">—</strong></div>
      <div><small>Прогресс</small><strong id="progress">0/0</strong></div>
      <div><small>Ходы</small><strong id="moves">0</strong></div>
      <div><small>Очки</small><strong id="score">0</strong></div>
    </section>

    <section id="taskBox" class="task"></section>
    <section id="gameArea" class="game-area"></section>
    <section id="feedback" class="feedback">Начинаем.</section>

    <div class="actions">
      <button id="restart" class="secondary">↻ Сначала</button>
      <button id="close" class="secondary">Закрыть</button>
    </div>

    <section id="finish" class="finish hidden" aria-live="polite">
      <h2 id="finishTitle">Готово!</h2>
      <p id="finishPraise"></p>
      <p id="finishText"></p>
      <button id="playAgain">Играть ещё раз</button>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
